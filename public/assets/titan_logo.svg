<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0e172a" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#050811" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#020408" stop-opacity="1" />
    </radialGradient>

    <!-- Accretion Disk Gold Glow -->
    <linearGradient id="goldPlasma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdd55" />
      <stop offset="45%" stop-color="#ff9900" />
      <stop offset="75%" stop-color="#ff3300" />
      <stop offset="100%" stop-color="#990033" />
    </linearGradient>

    <!-- Relativistic Cyan Jet -->
    <linearGradient id="cyanJet" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0077ff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#002266" stop-opacity="0.0" />
    </linearGradient>

    <!-- Text Metallic Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#d4f1f9" />
      <stop offset="70%" stop-color="#88ddff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Filter for Holographic Glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="1000" height="340" rx="16" fill="url(#bgGlow)" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Grid Micro-Lines -->
  <path d="M 40 40 L 960 40 M 40 300 L 960 300 M 180 40 L 180 300 M 820 40 L 820 300" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.12" stroke-dasharray="4 6" />

  <!-- Corner Tech Accents -->
  <path d="M 20 50 L 20 20 L 50 20" stroke="#00f0ff" stroke-width="2.5" fill="none" opacity="0.8" />
  <path d="M 980 50 L 980 20 L 950 20" stroke="#00f0ff" stroke-width="2.5" fill="none" opacity="0.8" />
  <path d="M 20 290 L 20 320 L 50 320" stroke="#ff9900" stroke-width="2.5" fill="none" opacity="0.8" />
  <path d="M 980 290 L 980 320 L 950 320" stroke="#ff9900" stroke-width="2.5" fill="none" opacity="0.8" />

  <!-- ================= EMBLEM ICON (LEFT) ================= -->
  <g transform="translate(140, 170)">
    <!-- Relativistic Jets -->
    <path d="M -6 0 L 0 -130 L 6 0 Z" fill="url(#cyanJet)" filter="url(#glow)" />
    <path d="M -6 0 L 0 130 L 6 0 Z" fill="url(#cyanJet)" filter="url(#glow)" transform="rotate(180)" />

    <!-- Outer Gravitational Einstein Rings -->
    <ellipse cx="0" cy="0" rx="98" ry="98" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 4" />
    <ellipse cx="0" cy="0" rx="84" ry="32" fill="none" stroke="url(#goldPlasma)" stroke-width="4.5" transform="rotate(-28)" filter="url(#glow)" />
    <ellipse cx="0" cy="0" rx="72" ry="24" fill="none" stroke="#ffdd55" stroke-width="2" transform="rotate(-28)" opacity="0.9" />

    <!-- Event Horizon Black Hole Core -->
    <circle cx="0" cy="0" r="38" fill="#000000" stroke="#ff3300" stroke-width="2.5" filter="url(#softGlow)" />
    <circle cx="0" cy="0" r="32" fill="#020307" />

    <!-- Photon Sphere Ring -->
    <circle cx="0" cy="0" r="41" fill="none" stroke="#ffbb00" stroke-width="1.5" stroke-opacity="0.85" filter="url(#softGlow)" />

    <!-- Central Singularity Spark -->
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" filter="url(#glow)" />
  </g>

  <!-- ================= TYPOGRAPHY (RIGHT) ================= -->
  <g transform="translate(305, 0)">
    <!-- Subtitle Flag / Core Version -->
    <g transform="translate(0, 95)">
      <rect x="0" y="-18" width="230" height="24" rx="4" fill="rgba(255, 51, 102, 0.15)" stroke="#ff3366" stroke-width="1" />
      <circle cx="14" cy="-6" r="3.5" fill="#ff3366" filter="url(#softGlow)" />
      <text x="28" y="-2" font-family="'Courier New', Consolas, monospace" font-size="11" font-weight="bold" fill="#ff5588" letter-spacing="2">APOCALYPSE ENGINE</text>
      
      <rect x="242" y="-18" width="138" height="24" rx="4" fill="rgba(0, 240, 255, 0.12)" stroke="#00f0ff" stroke-width="1" />
      <text x="254" y="-2" font-family="'Courier New', Consolas, monospace" font-size="10.5" font-weight="bold" fill="#4cc9f0" letter-spacing="1.5">v30.5 CORE</text>
    </g>

    <!-- Main Title "TITAN" -->
    <text x="0" y="180" font-family="'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" fill="url(#textGrad)" letter-spacing="6" filter="url(#softGlow)">
      TITAN
    </text>

    <!-- Secondary Title "INTERACTIVE COSMOS LAB" -->
    <text x="4" y="218" font-family="'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffaa00" letter-spacing="4">
      INTERACTIVE COSMOS LAB
    </text>

    <!-- Tagline & Specs -->
    <text x="4" y="254" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#94a3b8" letter-spacing="1.5">
      100% ANSI C99 NATIVE RUNTIME • AVX2 CELESTIAL MECHANICS
    </text>
    
    <text x="4" y="278" font-family="'Courier New', Consolas, monospace" font-size="11" fill="#4cc9f0" letter-spacing="1">
      RELATIVISTIC ASTROPHYSICS • STELLARIUM 2.0 • 83,467+ GAIA/HYG STARS
    </text>
  </g>

  <!-- Right Aesthetic Telemetry -->
  <g transform="translate(860, 110)" font-family="'Courier New', Consolas, monospace" font-size="10" fill="#64748b" text-anchor="end">
    <text y="0">SYS: ONLINE</text>
    <text y="20">SIMD: AVX2</text>
    <text y="40">FPS: 60.0 [SYNC]</text>
    <text y="60">LATENCY: 0.42ms</text>
    <text y="80">MEM: CONTIGUOUS</text>
    <circle cx="12" cy="77" r="3" fill="#00ff88" filter="url(#softGlow)" />
  </g>
</svg>
